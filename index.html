<!DOCTYPE html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'">
<title>Browse the atlas &mdash; HIV-1 Mutation Rate Atlas</title>
<link rel="stylesheet" href="css/mra.css">
<script src="vendor/html2canvas/html2canvas.min.js"></script>
</head>
<body>
<main>
<h1>Browse the atlas</h1>

<div id="dashboard-export">
<h2>Position dashboard</h2>

<!-- The track comes first, before the controls: it is both the headline figure and the
     primary way to pick a position, so a reader arriving at this heading should meet the
     plot rather than a row of selects. The control bar below refines what is on screen. -->
<figure class="chart plot-card" data-export-name="genome_track"><div id="genome-track"></div>
  <div class="track-slider" data-export-skip>
    <input type="range" id="track-slider" min="1" max="8213" step="1" value="1600"
           aria-label="Genome position (NL4-3 nucleotide)">
  </div>
  <figcaption id="track-caption"></figcaption></figure>

<!-- One control strip for the whole dashboard: what the track shows on the left, which
     position is selected on the right. These were two rows separated by a paragraph on
     protein numbering; that paragraph is now behind the bar's own Details button, which is
     where a reader looks once and then never again. -->
<div class="control-bar" data-export-skip>
  <div>
    <label for="track-window">Smoothing window (nt)</label>
    <input type="range" id="track-window" min="25" max="501" step="2" value="151">
    <output id="track-window-out">151</output>
  </div>
  <div>
    <label for="track-class">Supply shown</label>
    <select id="track-class">
      <option value="total">Total substitution supply</option>
      <option value="nonga">non-G&rarr;A only</option>
      <option value="ga">G&rarr;A only</option>
    </select>
  </div>
  <div>
    <label for="coord-system">Jump to</label>
    <select id="coord-system">
      <option value="protein">Protein position</option>
      <option value="nt">NL4-3 nucleotide</option>
    </select>
  </div>
  <div>
    <label for="protein">Protein or subunit</label>
    <select id="protein"></select>
  </div>
  <div>
    <label for="position">Position</label>
    <input type="number" id="position" min="1" value="46" size="8">
  </div>
  <div>
    <label for="reading-frame">Reading frame here</label>
    <select id="reading-frame"></select>
  </div>
  <div class="bar-actions">
    <button id="go">Go</button>
    <span id="share-slot"></span>
    <span id="coord-help"></span>
    <button id="download-png" class="secondary">Download dashboard (PNG)</button>
  </div>
</div>

<div id="dashboard-status" class="caveat">Loading the atlas tables&hellip;</div>
<div id="dashboard-head"></div>
<!-- A bare container, deliberately not class="chart": the two plot cards drawn into it are
     the figures, each with its own border, title and PNG button. Giving this one the chart
     class too would add a third download button for the pair, on top of the whole-dashboard
     one in the control bar. -->
<figure class="dashboard-figures" data-export-name="position_dashboard_supply"><div id="dashboard-chart"></div>
  <figcaption id="dashboard-caption"></figcaption>
</figure>

</div>

<div id="dashboard-table"></div>
<h3 id="paths-heading" hidden>Individual codon paths at this position</h3>
<div id="dashboard-paths"></div>

<p class="caveat">Looking up a whole list of mutations at once?
<a href="tables.html">MRA Table</a> takes a pasted list or a file and returns a rate for
each one.</p>
</main>
<script type="module" src="js/browse.js"></script>
</body>
</html>
