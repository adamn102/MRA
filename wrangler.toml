# SPDX-License-Identifier: MIT
# Cloudflare config, for the OPTIONAL direct-upload / CI deploy path only.
#
# You do NOT need this if you connect the GitHub repo in the Cloudflare Pages dashboard
# (the recommended route in docs/CLOUDFLARE_SETUP.md) -- that path has no build step and
# no config file. This exists only for `wrangler pages deploy` from a terminal or CI.
#
# `name` is the Pages project; pick something neutral, not tied to any model name.
name = "mra-demo"
compatibility_date = "2026-10-29"

[assets]
directory = "./dist"
